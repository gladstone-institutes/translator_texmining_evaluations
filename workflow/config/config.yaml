# estimate_semmedb_predicate_frequencies - main config.
# Copy to config_<cluster>.yaml for per-cluster overrides.

project_name: "estimate-semmedb-predicate-frequencies"

# Optional single storage path for cluster configs. When set (absolute), a
# RELATIVE output_dir or containers.dir resolves under it, launch.sh keeps its
# caches in <project_root>/.cache, and it is bound into every container. See
# config_corehpc.yaml.example. Unset here, so paths are relative to the checkout.
# project_root: "/abs/path/to/project/storage"

# Output directory for all results. TODO: point at a persistent location.
output_dir: "results"

# Sample metadata file (columns: sample_id, description, ...). Unused by the
# current rules (both are single, corpus-wide aggregations, not per-sample),
# kept for future per-sample work.
samples: "workflow/config/samples.tsv"

# SemMedDB-KGX (https://github.com/Translator-CATRAX/SemMedDB-KGX) "uncapped"
# archive: source for normalized_edges.jsonl / normalized_nodes.jsonl.
semmeddb_kgx:
  archive_url: "https://rtx-kg2-public.s3.us-west-2.amazonaws.com/kg2.10.3_semmeddb_dogpark_uncapped_2026_04_07.tar.gz"

# (subject_category, predicate, object_category) triples to report frequency
# counts for specifically, in addition to the full breakdown CSV. Categories
# are the most-specific Biolink category (no "biolink:" prefix); predicates
# likewise without the "biolink:" prefix.
predicate_lookup:
  - ["Procedure", "has_input", "PhysicalEntity"]
  - ["Disease", "located_in", "GrossAnatomicalStructure"]

# CTD-anchored SemMedDB recall estimate (rules/download_ctd.smk,
# rules/estimate_ctd_recall.smk). Source: https://ctdbase.org/downloads/
# "Curated Chemical-disease associations".
ctd:
  curated_chem_disease_url: "https://ctdbase.org/reports/CTD_curated_chemicals_diseases.csv.gz"
  # Most-specific Biolink categories (no "biolink:" prefix) treated as
  # chemical-like / disease-like when filtering SemMedDB-KGX edges and
  # matching CUIs to MeSH, per predicate_frequencies.csv's category breakdown.
  chemical_categories: ["SmallMolecule", "ChemicalEntity", "Drug", "ChemicalMixture"]
  disease_categories: ["Disease", "PhenotypicFeature", "DiseaseOrPhenotypicFeature"]
  # CTD's DirectEvidence value -> which SemMedDB predicates count as a match.
  # Narrow default: predicates too generic to reflect curated evidence
  # (related_to, coexists_with, located_in, produces, has_part, derives_from,
  # occurs_in, precedes) count toward neither.
  direct_evidence_predicate_map:
    therapeutic: ["treats_or_applied_or_studied_to_treat"]
    marker/mechanism:
      ["causes", "affects", "disrupts", "predisposes_to_condition",
       "exacerbates_condition", "interacts_with"]

# Per-rule compute resources. Standard units: total memory in GB, total
# runtime in minutes, thread count. workflow/rules/common.smk:_resources()
# translates these to scheduler-specific keys per the active profile:
#   Slurm -> mem_mb (total), runtime (minutes), gres (for --gres on GPU rules)
#   SGE   -> mem_free (per-slot), scratch, h_rt (HH:MM:SS), gpu   [deprecated]
# Every rule needs an entry here. Cluster configs (config_<cluster>.yaml) can
# override individual keys by adding a resources: block with just what changes.
#
# These start as guesses. After a run, replace them with observations:
#   uv run python workflow/scripts/calibrate_resources.py --output_dir <output_dir>
resources:
  # Downloads + extracts the SemMedDB-KGX uncapped archive (edges file alone
  # is 11GB; the full archive is larger). Guess: mostly network/disk-bound,
  # not CPU/RAM-heavy. Revisit runtime_min against actual download speed.
  download_semmeddb:
    threads: 1
    mem_gb: 2
    runtime_min: 240
  # Streams normalized_edges.jsonl (11GB) + normalized_nodes.jsonl through
  # DuckDB for a join + group-by. Guess: sized generously for the join;
  # replace after a real run with calibrate_resources.py.
  estimate_predicate_frequencies:
    threads: 4
    mem_gb: 32
    runtime_min: 180
  # Tiny file (~2MB gzipped), no login required. Guess: network-bound.
  download_ctd:
    threads: 1
    mem_gb: 1
    runtime_min: 15
  # Same two 11GB/small JSONL inputs as estimate_predicate_frequencies, but
  # filtered to chemical/disease-category edges before any unnest, so the
  # working set is much smaller. Guess: replace after a real run.
  estimate_ctd_recall:
    threads: 4
    mem_gb: 16
    runtime_min: 60

# Largest node in the partition (`sinfo -o "%P %m" | sort -u`), in GB. Caps a
# retried job's memory: an unsatisfiable request waits in the queue forever, it never fails.
max_node_mem_gb: 1500

# GPU settings (used only when a rule passes gpu=True to the helpers). Defaults
# target UCSF CoreHPC L40s nodes; see workflow/profiles/slurm/README.md.
gpu:
  # CoreHPC Slurm: GPU rules are routed to this partition with this gres string.
  slurm_partition: "small_gpu"
  slurm_gres: "gpu:nvidia_l40s:1"
  # Interval (seconds) for the optional nvidia-smi utilization sampler.
  sampler_interval_s: 5
  # sge_gpu_mem: "8G"   # SGE gpu.q only, deprecated (needs a sge submit-cmd edit)

# Email notification (optional). Needs 'mail'/'sendmail', so it is a no-op on
# CoreHPC: launch.sh hands this address to sbatch --mail-user instead.
notification:
  email: "reuben.thomas@gladstone.ucsf.edu"

# Execution mode. Set exactly one to true (both false = run on the host).
#   - use_docker:    wraps each rule's shell in `docker run`     (local testing)
#   - use_apptainer: wraps each rule's shell in `apptainer exec` (HPC)
# Containers are launched via the docker_run()/apptainer_run() shell prefixes in
# common.smk, NOT Snakemake's `container:` directive.
execution:
  use_docker: false
  use_apptainer: true
  # Run Docker containers as you, not root, so outputs are yours (matters on
  # Linux hosts). HOME becomes /workspace, the checkout, matching Apptainer.
  # Set false only for an image that must run as root.
  docker_run_as_user: true

# Container configuration. Each rule references images by the keys under `images`.
containers:
  # Directory for pre-pulled Apptainer .sif files.
  dir: ".snakemake/containers"
  # Auto-pull missing .sif files at pipeline start (set false if you manage SIFs yourself).
  auto_pull: true
  # Extra paths to bind into Apptainer containers (shared filesystems outside $PWD).
  bind_paths: []
  images:
    semmeddb_download:
      user: "ruben6um"
      name: "semmeddb-download"
      tag: "0.1.0"
    duckdb_predicates:
      user: "ruben6um"
      name: "duckdb-predicates"
      tag: "0.1.0"
