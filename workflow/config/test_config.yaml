# estimate_semmedb_predicate_frequencies - local Docker testing config.
# Used by `./workflow/pipeline.sh run` (and dry-run).

project_name: "estimate-semmedb-predicate-frequencies-test"

output_dir: ".tests/integration/results"
samples: "workflow/config/test_samples.tsv"

# Local Docker mode: docker_run() returns a `docker run` prefix.
# Both flags must be set explicitly: --configfile is merged over config.yaml,
# so omitting use_apptainer leaves the config.yaml default (true) in effect and
# trips the SIF auto-pull in onstart.
execution:
  use_docker: true
  use_apptainer: false

# Real images, not the quickstart bash placeholder the hello example used:
# build them locally first (no push needed for local Docker testing --
# docker_run() runs the local tag directly):
#   ./workflow/pipeline.sh build semmeddb_download --yes
#   ./workflow/pipeline.sh build duckdb_predicates --yes
containers:
  dir: ""
  auto_pull: true
  images:
    semmeddb_download:
      user: "ruben6um"
      name: "semmeddb-download"
      tag: "0.1.0"
    duckdb_predicates:
      user: "ruben6um"
      name: "duckdb-predicates"
      tag: "0.1.0"
